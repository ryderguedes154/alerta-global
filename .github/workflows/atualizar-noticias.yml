name: Atualizar notícias globais
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-noticias.yml'
      - 'scripts/coletar_noticias.py'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: coleta-global
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar RSS e USGS
        run: python scripts/coletar_noticias.py
      - name: Publicar notícias coletadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json status_fontes.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza notícias de fontes internacionais"
            git push
          fi
