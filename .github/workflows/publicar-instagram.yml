name: Publicar noticias no Instagram

on:
  schedule:
    - cron: "*/30 * * * *"  # a cada 30 minutos. Com 2 posts por vez = ~96 por dia (limite do Instagram: 100)
  workflow_dispatch:         # permite rodar na mao pela aba "Actions"

permissions:
  contents: write            # para salvar as imagens e o historico no repositorio

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMAGEM_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/instagram/imagens
      NOTICIAS_JSON_URL: ${{ vars.NOTICIAS_JSON_URL }}
      NOME_DO_SITE: ${{ vars.NOME_DO_SITE }}
      MAX_POSTS_POR_EXECUCAO: ${{ vars.MAX_POSTS_POR_EXECUCAO }}
      IDADE_MAXIMA_HORAS: ${{ vars.IDADE_MAXIMA_HORAS }}
      USAR_IMAGEM_DA_MATERIA: ${{ vars.USAR_IMAGEM_DA_MATERIA }}
      USAR_CLAUDE: ${{ vars.USAR_CLAUDE }}
      HASHTAGS_FIXAS: ${{ vars.HASHTAGS_FIXAS }}
      COR_DE_FUNDO: ${{ vars.COR_DE_FUNDO }}
      GRAPH_HOST: ${{ vars.GRAPH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Buscar noticias novas e gerar imagem + legenda
        run: python publicar.py preparar

      - name: Enviar imagens para o repositorio (o Instagram baixa daqui)
        run: bash salvar.sh "Instagram: noticias preparadas"

      - name: Publicar no Instagram
        run: python publicar.py publicar

      - name: Salvar historico do que foi publicado
        if: always()
        run: bash salvar.sh "Instagram: historico de publicacoes"
