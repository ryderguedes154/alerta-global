name: Gerar ícones do Alerta Global
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'icons/alerta-global.svg'
      - 'scripts/gerar_icones.py'
      - '.github/workflows/gerar-icones.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor SVG
        run: python -m pip install cairosvg
      - name: Gerar PNG para Android e iOS
        run: python scripts/gerar_icones.py
      - name: Publicar ícones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Gerar ícones PNG da identidade Alerta Global"
            git pull --rebase origin main
            git push origin main
          fi
