<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#df2337">
<title>Atualizar portal | Alerta Global</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f8fa;color:#1b2737;display:grid;place-items:center;padding:24px}
main{background:#fff;border:1px solid #e2e7ed;border-top:3px solid #df2337;border-radius:22px;padding:28px;max-width:490px;width:100%;box-shadow:0 22px 65px #0009}
small{color:#df2337;font-weight:800;letter-spacing:.14em}h1{font-size:27px;margin:10px 0;line-height:1.2}p{color:#64748b}a{display:block;background:#df2337;color:white;text-align:center;text-decoration:none;border-radius:13px;padding:13px 17px;font-weight:800;margin-top:18px}a:focus-visible{outline:3px solid white;outline-offset:4px}
#status{min-height:27px;color:#e5f1ff}.colors{display:flex;gap:10px;margin:20px 0}.colors b{display:block;width:32px;height:32px;border:1px solid #ffffff50;border-radius:9px}.colors b:nth-child(1){background:#05070d}.colors b:nth-child(2){background:#e32e42}.colors b:nth-child(3){background:#0b1728}.colors b:nth-child(4){background:#f8fbff}
</style>
</head>
<body>
<main>
<small>ALERTA GLOBAL · ATUALIZAÇÃO DE TEMA</small>
<h1>🚨 Nova logo do Alerta Global</h1>
<p>Carregando a nova logo oficial no computador e no celular. Suas preferências e notícias continuam preservadas.</p>

<p id="status" role="status">Limpando apenas o cache antigo do Alerta Global...</p>
<a id="open" href="./index.html?tema=marca-desktop-mobile-20261117-v4">Abrir o Alerta Global atualizado</a>
</main>
<script>
(async()=>{
  const status=document.getElementById("status");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(reg=>new URL(reg.scope).pathname.includes("/alerta-global/")).map(reg=>reg.unregister()));
    }
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith("alerta-")).map(k=>caches.delete(k)));
    }
    status.textContent="Cache antigo limpo. Abrindo o novo visual...";
  }catch(error){
    console.warn("Limpeza parcial do cache:",error);
    status.textContent="Atualização preparada. Se necessário, toque no botão abaixo.";
  }
  location.replace("./index.html?tema=marca-desktop-mobile-20261117-v4");
})();
</script>
</body>
</html>
